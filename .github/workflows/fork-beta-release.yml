name: Fork BETA release

on:
  push:
    branches:
      - beta-release/3.6.8-beta3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: BETA ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
            arch: x64
          - platform: macos
            runner: macos-15-arm64
            arch: arm64
          - platform: windows
            runner: windows-2022
            arch: x64
          - platform: windows
            runner: windows-11-arm
            arch: arm64
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
          - platform: linux
            runner: ubuntu-24.04-arm
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      RELEASE_CHANNEL: beta
      DESKTOP_UNSIGNED: '1'
      DESKTOP_E2E_UPDATES_URL: ''
      TARGET_ARCH: ${{ matrix.arch }}
      npm_config_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture:
            ${{ matrix.platform == 'windows' && matrix.arch == 'arm64' && 'x64'
            || matrix.arch }}
      - name: Validate native runner architecture
        run:
          node -e "if (process.arch !== process.env.TARGET_ARCH) throw new
          Error('Runner architecture mismatch')"
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run:
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev
          libx11-dev libxkbfile-dev
      - name: Cache locked dependencies from the public npm registry
        run:
          node script/cache-public-release-dependencies.mjs
          "$RUNNER_TEMP/beta.yarnrc"
      - name: Install dependencies
        run:
          node vendor/yarn-1.21.1.js --use-yarnrc "$RUNNER_TEMP/beta.yarnrc"
          install --frozen-lockfile
      - name: Validate changelog
        run: yarn validate-changelog
      - name: Compile and build BETA
        run: yarn build:prod
      - name: Run full unit suite on Linux x64
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: yarn test --test-concurrency=4
        env:
          GIT_DISCOVERY_ACROSS_FILESYSTEM: '1'
      - name: Run packaging regression tests
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: yarn test:script
      - name: Package macOS and Windows
        if: runner.os != 'Linux'
        run: yarn package
      - name: Collect versioned assets and build provenance
        run: node script/collect-beta-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.platform }}-${{ matrix.arch }}
          path: beta-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish BETA prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: beta-assets
          merge-multiple: true
      - name: Verify assets and record complete source comparison
        env:
          UPSTREAM_BASELINE: bebc062caafcf818993b9f53397b976d33484231
        run: |
          git fetch https://github.com/desktop/desktop.git "$UPSTREAM_BASELINE"
          git diff "$UPSTREAM_BASELINE" "$GITHUB_SHA" > beta-assets/UPSTREAM-DIFF.patch
          cp docs/releases/3.6.8-beta3.md beta-assets/RELEASE-NOTES.md
          node script/verify-beta-assets.mjs
          cd beta-assets
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create and publish BETA release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create release-3.6.8-beta3 --target "$RELEASE_COMMIT" \
            --title "GitHub Desktop Word Wrap 3.6.8-beta3 (BETA)" \
            --notes-file docs/releases/3.6.8-beta3.md --prerelease --latest=false --draft
          gh release upload release-3.6.8-beta3 beta-assets/*
          gh release edit release-3.6.8-beta3 --draft=false --prerelease --latest=false
          gh release view release-3.6.8-beta3 --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
